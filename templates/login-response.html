{% extends "base.html" %}

{% block page_content %}
<div class="page-header" style="border-bottom: 1px solid #eee; margin-top: 20px; padding-bottom: 15px;">
    <h2>Dados do acesso</h2>
</div>

<div style="margin-top: 25px;">
    <h3>Você está acessando o sistema por meio do usuário {{ username }}</h3>
</div>

<div style="margin-top: 30px;">
    <p>The local date and time is {{ moment(current_time).format('LLLL') }}.</p>
    <p>That was {{ moment(current_time).fromNow() }}.</p>
</div>
{% endblock %}
